name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install beautifulsoup4 requests pytest
      - name: Alert scraper (Python)
        run: python -m pytest -q tests
      - name: Browser parser matches Python
        run: node tests/test_alerts.js
